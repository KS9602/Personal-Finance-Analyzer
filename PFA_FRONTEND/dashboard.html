<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Dashboard – Wydatki</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<header class="navbar">
    <div class="logo">PFA</div>
    <div class="nav-actions">
        <button class="tab-btn active" data-tab="expensesTab">Wydatki</button>
        <button class="tab-btn" data-tab="dashboardTab">Dashboard</button>
        <button id="logoutBtn" class="btn danger">Wyloguj</button>
    </div>
</header>

<main class="container">
    <section id="expensesTab" class="tab-content active">

        <div class="grid">
            <div class="card">
                <h2>Dodaj wydatek</h2>

                <form id="expenseForm">
                    <div class="form-row">
                        <label>Cena</label>
                        <input type="number" step="0.01" id="amount" required>
                    </div>

                    <div class="form-row">
                        <label>Data</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="form-row">
                        <label>Kategoria</label>
                        <select id="category"></select>
                    </div>

                    <div class="form-row">
                        <label>Opis</label>
                        <input type="text" id="description" placeholder="Opcjonalnie">
                    </div>

                    <button type="submit" class="btn primary full">Dodaj</button>
                </form>
            </div>

            <div class="card">
                <h2>Twoje wydatki</h2>

                <div class="table-top">
                    <div id="pageCounter"></div>
                    <div class="pagination">
                        <button id="previousPageBtn" class="btn">←</button>
                        <button id="nextPageBtn" class="btn">→</button>
                    </div>
                </div>

                <div class="summary">
                    Suma: <span id="totalAmount">0</span> zł
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Kategoria</th>
                                <th>Opis</th>
                                <th>Cena</th>
                                <th>Data</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="expensesTable"></tbody>
                    </table>
                </div>

            </div>
        </div>

    </section>
    <section id="dashboardTab" class="tab-content">
        <div class="card dashboard-card">

            <h2>📊 Analiza wydatków</h2>

            <div class="filters">
                <div class="form-row">
                    <label>Kategoria</label>
                    <select id="chartCategory">
                        <option value="">Wszystkie</option>
                    </select>
                </div>

                <div class="form-row">
                    <label>Od</label>
                    <input type="date" id="chartDateFrom">
                </div>

                <div class="form-row">
                    <label>Do</label>
                    <input type="date" id="chartDateTo">
                </div>

                <button id="loadChartBtn" class="btn primary">Pokaż</button>
                            <button id="generateReportBtn" class="btn primary">
                Generuj raport
            </button>
            </div>

            <canvas id="expensesChart" height="100"></canvas>

        </div>
    </section>

</main>

<script>
document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));

        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
    });
});
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
